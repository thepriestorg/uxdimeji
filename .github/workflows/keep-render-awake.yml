# Render's free plan puts the site to sleep after 15 minutes without visitors, and the
# next visitor then waits about a minute. Visiting it every 10 minutes keeps it awake.
# Delete this file when the site moves back to Vercel.
name: Keep Render awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Visit the site
        run: curl --silent --show-error --output /dev/null --max-time 120 --retry 2 --write-out "%{http_code} in %{time_total}s\n" https://uxdimeji.onrender.com/
